<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>unit converter</title>
        <link
            rel="icon"
            type="image/png"
            href="/favicon.ico/favicon-96x96.png"
            sizes="96x96"
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.ico/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/favicon.ico/apple-touch-icon.png"
        />
        <link rel="manifest" href="/favicon.ico/site.webmanifest" />
        <link rel="stylesheet" href="style.css" />
        <script src="app.js" defer></script>
    </head>
    <body>
        <h1 id="splash">top text</h1>
        <form id="form">
            <div class="field">
                <label for="dimension">measurement</label>
                <select id="dimension" required></select>
            </div>

            <div class="field">
                <label for="value">value</label>
                <input
                    type="number"
                    id="value"
                    step="any"
                    required
                    placeholder="0.00"
                />
            </div>

            <div class="field">
                <label for="from">from</label>
                <select id="from" required></select>
            </div>

            <div class="field">
                <label for="to">to</label>
                <select id="to" required></select>
            </div>

            <button type="submit">convert</button>
        </form>
        <div id="response">= ...</div>
    </body>
</html>
